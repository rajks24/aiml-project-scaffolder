[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiml-project-scaffolder"
dynamic = ["version"]
description = "Interactive generator for reproducible AI/ML experiment projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rajesh Singh" }]
keywords = ["ai", "machine-learning", "scaffolding", "python", "mlops", "jupyter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rajks24/aiml-project-scaffolder"
Documentation = "https://github.com/rajks24/aiml-project-scaffolder/tree/main/docs"
Issues = "https://github.com/rajks24/aiml-project-scaffolder/issues"
Changelog = "https://github.com/rajks24/aiml-project-scaffolder/blob/main/CHANGELOG.md"

[project.scripts]
aiml-scaffold = "aiml_scaffolder.cli:main"

[dependency-groups]
dev = ["pre-commit>=4.2", "pytest>=8.3", "pyyaml>=6.0", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["aiml_scaffolder"]

[tool.hatch.version]
path = "aiml_scaffolder/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
