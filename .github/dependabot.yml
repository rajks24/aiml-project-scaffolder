version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns: ["*"]
