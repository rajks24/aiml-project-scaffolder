name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create a GitHub release and upload its distributions.
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          # Release artifacts must not depend on a pull-request-writable cache.
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify tag matches package version
        run: |
          package_version="$(uv run python -c 'from aiml_scaffolder import __version__; print(__version__)')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Run quality checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Build and validate distributions
        run: |
          uv build
          uvx twine check dist/*
      - name: Create release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
