name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create a GitHub release and upload its distributions.
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          # Release artifacts must not depend on a pull-request-writable cache.
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify tag matches package version
        run: |
          package_version="$(uv run python -c 'from aiml_scaffolder import __version__; print(__version__)')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Run quality checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Build and validate distributions
        run: |
          uv build
          uvx twine check dist/*
      - name: Create release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
