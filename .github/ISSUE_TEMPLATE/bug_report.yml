name: Bug report
description: Report reproducible incorrect behavior in the scaffolder or generated project
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove secrets, credentials, and private dataset content.
        Security vulnerabilities must follow SECURITY.md instead of this public form.
  - type: checkboxes
    id: checks
    attributes:
      label: Initial checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I reproduced this with the latest `main` branch when practical.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: Scaffolder version or commit
      description: Include the release version, Git commit, or installation source.
      placeholder: v2.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Generated environment manager
      options:
        - uv
        - conda
        - both
        - Not applicable
    validations:
      required: true
  - type: input
    id: profiles
    attributes:
      label: Selected profiles and integrations
      placeholder: general + genai + hf, MLflow, DVC
  - type: textarea
    id: command
    attributes:
      label: Command or interactive selections
      description: Provide the exact command, or list every wizard selection.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and complete error output
      description: Include logs as text, not only screenshots. Remove sensitive information.
      render: text
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System information
      description: Operating system, architecture, Python, uv/Conda, and shell versions.
      placeholder: macOS arm64, Python 3.12, uv 0.x, zsh
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add a minimal repository link, dry-run output, or other relevant details.
